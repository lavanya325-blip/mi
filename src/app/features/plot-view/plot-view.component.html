<section class="plot-view">
  <header class="plot-header">
    <div class="plot-title">Plot View</div>
    <div class="plot-header-actions">
      <button type="button" class="icon-btn" title="Full screen" aria-label="Full screen">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button type="button" class="icon-btn" title="More" aria-label="More">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 6h10L8 12 3 6Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="manipulation-tools" role="toolbar" aria-label="Plot operations">
    <button
      *ngFor="let tool of tools"
      type="button"
      class="tool-btn"
      [class.is-active]="activeTool === tool.id || (tool.id === 'grid' && gridEnabled) || (tool.id === 'bits' && showBits) || (tool.id === 'cursor' && cursorEnabled)"
      [attr.title]="tool.label"
      [attr.aria-label]="tool.label"
      (click)="onTool(tool.id, $event)"
    >
      <ng-container [ngSwitch]="tool.id">
        <svg *ngSwitchCase="'snapshot'" viewBox="0 0 16 16"><path d="M3 5h2l1-1.5h4L11 5h2v8H3V5Z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'fit'" viewBox="0 0 16 16"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'zoomIn'" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 10 14 14M5 7h4M7 5v4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'zoomOut'" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 10 14 14M5 7h4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'pan'" viewBox="0 0 16 16"><path d="M8 2v12M5 5l3-3 3 3M5 11l3 3 3-3" fill="none" stroke="#F5C518" stroke-width="1.4"/></svg>
        <svg *ngSwitchCase="'grid'" viewBox="0 0 16 16"><path d="M3 3h10v10H3V3ZM3 8h10M8 3v10" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'cursor'" viewBox="0 0 16 16"><path d="M8 2v12" stroke="currentColor" stroke-width="1.5"/><path d="M5 4h6M5 12h6" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'hZoom'" viewBox="0 0 16 16"><path d="M2 8h12M4 5 2 8l2 3M12 5l2 3-2 3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'bits'" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></svg>
        <svg *ngSwitchCase="'more'" viewBox="0 0 16 16"><circle cx="8" cy="3" r="1.2" fill="currentColor"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="8" cy="13" r="1.2" fill="currentColor"/></svg>
      </ng-container>
    </button>

    <div class="more-menu" *ngIf="showMore" (click)="$event.stopPropagation()">
      <button type="button" (click)="resetView()">Reset view</button>
    </div>
  </div>

  <div class="plot-body">
    <div class="lane-rail">
      <div class="lane-label" *ngFor="let lane of lanes; trackBy: trackLane" [style.height.px]="laneHeight">
        <span class="lane-bar" [style.background]="lane.color"></span>
        <div class="lane-text">
          <div class="lane-name">{{ lane.name }}</div>
          <div class="lane-sub">
            <span class="swatch" [style.background]="lane.color"></span>
            {{ lane.subtitle }}
          </div>
        </div>
      </div>
    </div>

    <div #waveformContainer class="waveform-container">
      <svg
        #waveformsvg
        class="waveform-svg"
        [attr.width]="plotWidth"
        [attr.height]="plotHeight"
        (mousedown)="waveformMousedown($event)"
        (mousemove)="waveformMousemove($event)"
        (mouseup)="waveformMouseup($event)"
      >
        <g class="grid" *ngIf="gridEnabled">
          <line
            *ngFor="let x of gridLines"
            [attr.x1]="x"
            [attr.x2]="x"
            y1="0"
            [attr.y2]="plotHeight"
            class="grid-line"
          ></line>
          <line
            *ngFor="let lane of lanes; let i = index; trackBy: trackLane"
            x1="0"
            [attr.x2]="plotWidth"
            [attr.y1]="(i + 1) * laneHeight"
            [attr.y2]="(i + 1) * laneHeight"
            class="grid-line"
          ></line>
        </g>

        <g class="zoom-content">
          <ng-container *ngFor="let lane of lanes; trackBy: trackLane">
            <path
              *ngIf="lane.kind === 'channel'"
              class="wave-path"
              [attr.d]="channelPaths.get(lane.id)?.path"
              [attr.stroke]="lane.color"
            ></path>

            <g *ngIf="lane.kind === 'bus'">
              <polygon
                *ngFor="let polygon of busPolygons.get(lane.id)"
                class="bus-poly"
                [attr.points]="polygon.path"
                [attr.fill]="lane.color"
              ></polygon>
              <text
                *ngFor="let polygon of busPolygons.get(lane.id)"
                class="bus-text"
                [attr.x]="polygon.center.x"
                [attr.y]="polygon.center.y"
              >{{ showBits ? polygon.content : polygon.content }}</text>
            </g>
          </ng-container>
        </g>

        <rect
          *ngIf="showOverlay"
          class="zoom-overlay"
          [attr.x]="overlayX"
          y="0"
          [attr.width]="overlayWidth"
          [attr.height]="plotHeight"
        ></rect>

        <line
          *ngIf="cursorEnabled && cursorX >= 0"
          class="cursor-line"
          [attr.x1]="cursorX"
          [attr.x2]="cursorX"
          y1="0"
          [attr.y2]="plotHeight"
        ></line>
      </svg>
    </div>
  </div>
</section>
