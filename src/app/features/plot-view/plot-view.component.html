<section class="plot-view">
  <header class="plot-header">
    <div class="plot-title">Plot View</div>
    <div class="plot-header-actions">
      <button type="button" class="icon-btn" title="Expand" aria-label="Expand">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button type="button" class="icon-btn" title="Views" aria-label="Views">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 6h10L8 12 3 6Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="manipulation-tools" role="toolbar" aria-label="Plot operations">
    <button
      *ngFor="let tool of tools"
      type="button"
      class="tool-btn"
      [class.is-active]="
        activeTool === tool.id
        || (tool.id === 'grid' && gridEnabled)
        || (tool.id === 'cursor' && cursorEnabled)
        || (tool.id === 'select' && selectEnabled)
        || (tool.id === 'marker' && markerEnabled)
        || (tool.id === 'flag' && flagEnabled)
      "
      [attr.title]="tool.label"
      [attr.aria-label]="tool.label"
      (click)="onTool(tool.id, $event)"
    >
      <ng-container [ngSwitch]="tool.id">
        <svg *ngSwitchCase="'snapshot'" viewBox="0 0 16 16"><path d="M3 5h2l1-1.5h4L11 5h2v8H3V5Z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'fit'" viewBox="0 0 16 16"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'zoomIn'" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 10 14 14M5 7h4M7 5v4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'zoomOut'" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 10 14 14M5 7h4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'pan'" viewBox="0 0 16 16"><path d="M8 2.5 6 5h1.4V11H6l2 2.5L10 11H8.6V5H10L8 2.5Z" fill="#F5C518"/></svg>
        <svg *ngSwitchCase="'select'" viewBox="0 0 16 16"><path d="M4 2 12 9.2 8.6 9.6 10.8 14 9 14.7 6.7 10.2 4 12V2Z" fill="currentColor"/></svg>
        <svg *ngSwitchCase="'cursor'" viewBox="0 0 16 16"><path d="M8 1v14" stroke="currentColor" stroke-width="1.5"/><path d="M5 3h6M5 13h6" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'marker'" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 5.5v5M5.5 8h5" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'grid'" viewBox="0 0 16 16"><path d="M2 8h12M8 2v12M4 4h8v8H4V4Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <svg *ngSwitchCase="'flag'" viewBox="0 0 16 16"><path d="M4 2v12M4 3h8l-2 3 2 3H4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </ng-container>
    </button>
  </div>

  <div class="plot-body">
    <div class="lane-rail">
      <div class="lane-label" *ngFor="let track of tracks; trackBy: trackTrack" [style.height.px]="laneHeight">
        <span class="lane-bar" [style.background]="track.color"></span>
        <div class="lane-text">
          <div class="lane-name">{{ track.name }}</div>
          <div class="lane-sub">
            <span class="swatch" [style.background]="track.color"></span>
            {{ track.subtitle }}
          </div>
        </div>
      </div>
    </div>

    <div #waveformContainer class="waveform-container">
      <svg
        #waveformsvg
        class="waveform-svg"
        [attr.width]="plotWidth"
        [attr.height]="plotHeight"
        (mousedown)="waveformMousedown($event)"
        (mousemove)="waveformMousemove($event)"
        (mouseup)="waveformMouseup($event)"
      >
        <g class="grid" *ngIf="gridEnabled">
          <line
            *ngFor="let line of gridLines"
            [attr.x1]="line.x"
            [attr.x2]="line.x"
            y1="0"
            [attr.y2]="plotHeight - axisHeight"
            class="grid-line"
          ></line>
          <line
            *ngFor="let track of tracks; let i = index; trackBy: trackTrack"
            x1="0"
            [attr.x2]="plotWidth"
            [attr.y1]="(i + 1) * laneHeight"
            [attr.y2]="(i + 1) * laneHeight"
            class="grid-line lane-sep"
          ></line>
        </g>

        <g class="zoom-content">
          <ng-container *ngFor="let track of tracks; trackBy: trackTrack">
            <path
              *ngIf="track.kind === 'channel'"
              class="wave-path"
              [attr.d]="channelPaths.get(track.id)"
              [attr.stroke]="track.color"
            ></path>

            <g *ngIf="track.kind === 'bus'">
              <path
                class="wave-path"
                [attr.d]="busWavePaths.get(track.id)"
                [attr.stroke]="track.color"
              ></path>
              <polygon
                *ngFor="let polygon of busPolygons.get(track.id)"
                class="bus-poly"
                [attr.points]="polygon.path"
                [attr.fill]="track.color"
              ></polygon>
              <text
                *ngFor="let polygon of busPolygons.get(track.id)"
                class="bus-text"
                [attr.x]="polygon.center.x"
                [attr.y]="polygon.center.y"
              >{{ polygon.content }}</text>
            </g>
          </ng-container>
        </g>

        <rect
          *ngIf="showOverlay"
          class="zoom-overlay"
          [attr.x]="overlayX"
          y="0"
          [attr.width]="overlayWidth"
          [attr.height]="plotHeight - axisHeight"
        ></rect>

        <line
          *ngIf="cursorEnabled && cursorX >= 0"
          class="cursor-line"
          [attr.x1]="cursorX"
          [attr.x2]="cursorX"
          y1="0"
          [attr.y2]="plotHeight - axisHeight"
        ></line>

        <g *ngFor="let x of markers">
          <line class="marker-line" [attr.x1]="x" [attr.x2]="x" y1="0" [attr.y2]="plotHeight - axisHeight"></line>
        </g>
        <g *ngFor="let x of flags">
          <path class="flag-mark" [attr.d]="'M' + x + ' 4 l10 4 -10 4 Z'"></path>
          <line class="flag-line" [attr.x1]="x" [attr.x2]="x" y1="4" [attr.y2]="plotHeight - axisHeight"></line>
        </g>

        <g class="time-axis">
          <line
            class="grid-line"
            x1="0"
            [attr.x2]="plotWidth"
            [attr.y1]="plotHeight - axisHeight"
            [attr.y2]="plotHeight - axisHeight"
          ></line>
          <text
            *ngFor="let line of gridLines"
            class="axis-label"
            [attr.x]="line.x"
            [attr.y]="plotHeight - 6"
          >{{ line.label }}</text>
        </g>
      </svg>
    </div>
  </div>
</section>
