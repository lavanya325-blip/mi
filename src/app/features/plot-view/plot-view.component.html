<section class="plot-view">
  <header class="plot-header">
    <div class="plot-title">Plot View</div>
    <div class="plot-header-actions">
      <button
        type="button"
        class="icon-btn"
        [class.is-active]="isFullscreen"
        title="Full screen"
        aria-label="Full screen"
        (click)="toggleFullscreen(); $event.stopPropagation()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm16 0v6h-6v-2h4v-4h2z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="manipulation-tools" role="toolbar" aria-label="Plot operations">
    <button
      *ngFor="let tool of tools"
      type="button"
      class="tool-btn"
      [style.order]="tool.order"
      [class.is-active]="isToolLit(tool.id)"
      [attr.title]="tool.label"
      [attr.aria-label]="tool.label"
      (click)="onTool(tool.id, $event)"
      (mousedown)="$event.stopPropagation()"
    >
      <!-- Camera alt -->
      <svg *ngIf="tool.id === 'snapshot'" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/>
      </svg>
      <!-- Expand content -->
      <svg *ngIf="tool.id === 'expand'" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm16 0v6h-6v-2h4v-4h2z"/>
      </svg>
      <!-- Mouse -->
      <svg *ngIf="tool.id === 'select'" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M13 1.07V9h7c0-4.08-3.05-7.44-7-7.93zM4 15c0 4.42 3.58 8 8 8s8-3.58 8-8v-4H4v4zm7-13.93C7.05 1.56 4 4.92 4 9h7V1.07z"/>
      </svg>
      <!-- Zoom in -->
      <svg *ngIf="tool.id === 'zoomIn'" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z"/>
      </svg>
      <!-- Zoom out -->
      <svg *ngIf="tool.id === 'zoomOut'" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z"/>
      </svg>
      <!-- Pan tool -->
      <svg *ngIf="tool.id === 'pan'" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M23 5.5V20c0 2.2-1.8 4-4 4h-7.3c-1.08 0-2.1-.43-2.85-1.19L1 14.83s1.26-1.23 1.3-1.25c.22-.19.49-.29.79-.29.22 0 .42.06.6.16L8 15.5V4c0-.83.67-1.5 1.5-1.5S11 3.17 11 4v7h1V1.5c0-.83.67-1.5 1.5-1.5S15 .67 15 1.5V11h1V2.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5V11h1V5.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5z"/>
      </svg>
      <!-- Drag pan -->
      <svg *ngIf="tool.id === 'move'" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M15 9.5V6h2.5L12 0.5 6.5 6H9v3.5H5.5V6L0 12l5.5 6v-3.5H9V18H6.5L12 23.5 17.5 18H15v-3.5h3.5V18L24 12l-5.5-6v3.5H15z"/>
      </svg>
      <!-- Calendar month -->
      <svg *ngIf="tool.id === 'cursor'" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/>
      </svg>
      <!-- Grid 3x3 -->
      <svg *ngIf="tool.id === 'grid'" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 20H4v-4h4v4zm0-6H4v-4h4v4zm0-6H4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4z"/>
      </svg>
      <!-- Table chart view -->
      <svg *ngIf="tool.id === 'flag'" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M10 10.02h5V21h-5zM17 21h3c1.1 0 2-.9 2-2v-9h-5v11zm3-18H5c-1.1 0-2 .9-2 2v3h19V5c0-1.1-.9-2-2-2zM3 19c0 1.1.9 2 2 2h3V10H3v9z"/>
      </svg>
    </button>
  </div>

  <div class="plot-body" *ngIf="hasData">
    <div class="lane-rail">
      <div class="lane-label" *ngFor="let track of tracks; trackBy: trackTrack" [style.height.px]="laneHeight(track)">
        <span class="lane-bar" [style.background]="track.color"></span>
        <div class="lane-text">
          <div class="lane-name">{{ track.name }}</div>
          <div class="lane-sub">
            <span class="swatch" [style.background]="track.color"></span>
            {{ track.subtitle }}
          </div>
        </div>
      </div>
    </div>

    <div #waveformContainer class="waveform-container">
      <svg
        #waveformsvg
        class="waveform-svg"
        [attr.width]="plotWidth"
        [attr.height]="plotHeight"
        [style.cursor]="plotCursor()"
        (mousedown)="waveformMousedown($event)"
        (wheel)="waveformWheel($event)"
      >
        <g class="grid" *ngIf="gridEnabled">
          <line
            *ngFor="let line of gridLines"
            [attr.x1]="line.x"
            [attr.x2]="line.x"
            y1="0"
            [attr.y2]="plotHeight - axisHeight"
            class="grid-line"
          ></line>
          <line
            *ngFor="let track of tracks; let i = index; trackBy: trackTrack"
            x1="0"
            [attr.x2]="plotWidth"
            [attr.y1]="laneTop(i + 1)"
            [attr.y2]="laneTop(i + 1)"
            class="grid-line lane-sep"
          ></line>
        </g>

        <g class="zoom-content">
          <ng-container *ngFor="let track of tracks; let i = index; trackBy: trackTrack">
            <path
              class="wave-path"
              [attr.d]="wavePaths.get(track.id)"
              [attr.stroke]="track.color"
            ></path>

            <g *ngIf="track.kind === 'bus' && decodeEnabled" class="bus-decode">
              <line
                class="decode-rail"
                x1="0"
                [attr.x2]="plotWidth"
                [attr.y1]="decodeTop(i) + 0.5"
                [attr.y2]="decodeTop(i) + 0.5"
              ></line>
              <line
                class="decode-idle"
                x1="0"
                [attr.x2]="plotWidth"
                [attr.y1]="decodeTop(i) + decodeHeight / 2"
                [attr.y2]="decodeTop(i) + decodeHeight / 2"
              ></line>
              <line
                class="decode-rail"
                x1="0"
                [attr.x2]="plotWidth"
                [attr.y1]="decodeTop(i) + decodeHeight - 0.5"
                [attr.y2]="decodeTop(i) + decodeHeight - 0.5"
              ></line>
              <ng-container *ngFor="let polygon of busPolygons.get(track.id)">
                <polygon
                  class="bus-poly"
                  [attr.points]="polygon.path"
                  [attr.fill]="track.color"
                ></polygon>
                <text
                  class="bus-text"
                  [attr.x]="polygon.center.x"
                  [attr.y]="polygon.center.y"
                >{{ polygon.content }}</text>
              </ng-container>
            </g>
          </ng-container>
        </g>

        <rect
          *ngIf="showOverlay"
          class="zoom-overlay"
          [attr.x]="overlayX"
          y="0"
          [attr.width]="overlayWidth"
          [attr.height]="plotHeight - axisHeight"
        ></rect>

        <g *ngFor="let time of cursorTimes">
          <line
            class="cursor-line"
            [attr.x1]="timeX(time)"
            [attr.x2]="timeX(time)"
            y1="0"
            [attr.y2]="plotHeight - axisHeight"
          ></line>
        </g>
        <g *ngFor="let time of markerTimes">
          <line
            class="marker-line"
            [attr.x1]="timeX(time)"
            [attr.x2]="timeX(time)"
            y1="0"
            [attr.y2]="plotHeight - axisHeight"
          ></line>
        </g>

        <g class="time-axis">
          <line
            class="grid-line lane-sep"
            x1="0"
            [attr.x2]="plotWidth"
            [attr.y1]="plotHeight - axisHeight"
            [attr.y2]="plotHeight - axisHeight"
          ></line>
          <text
            *ngFor="let line of gridLines"
            class="axis-label"
            [attr.x]="line.x"
            [attr.y]="plotHeight - 6"
          >{{ line.label }}</text>
        </g>
      </svg>
    </div>
  </div>

  <div class="empty-state" *ngIf="!hasData">
    Load a trace to display waveforms.
  </div>
</section>
