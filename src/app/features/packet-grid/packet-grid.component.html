<section class="packet-grid" aria-label="Packet Grid View">
  <div class="section-title">Packet Grid View</div>

  <div class="grid-wrap">
    <table>
      <thead>
        <tr>
          <th *ngFor="let column of columns">{{ column.label }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows; trackBy: trackRow">
          <td>{{ row.busA }}</td>
          <td>{{ row.busB }}</td>
          <td>{{ row.command }}</td>
          <td>{{ row.dataWord }}</td>
          <td>{{ row.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
